<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="WeChat group chat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f7f0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bg)"/>
  <!-- back bubble: the second conversation in the room -->
  <path d="M78 30h26a10 10 0 0 1 10 10v20a10 10 0 0 1-10 10h-8l-10 9v-9h-8a10 10 0 0 1-10-10V40a10 10 0 0 1 10-10Z"
        fill="#ffffff" fill-opacity="0.34"/>
  <!-- front bubble -->
  <path d="M34 44h44a12 12 0 0 1 12 12v28a12 12 0 0 1-12 12H58l-16 14v-14h-8a12 12 0 0 1-12-12V56a12 12 0 0 1 12-12Z"
        fill="url(#front)"/>
  <circle cx="46" cy="70" r="5" fill="#047857"/>
  <circle cx="62" cy="70" r="5" fill="#059669"/>
  <circle cx="78" cy="70" r="5" fill="#10b981"/>
</svg>
